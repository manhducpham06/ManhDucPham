let NEAR=null,JOB=null,hpWarn=false,lifeT=0;
const svcE=(i,j)=>[i*CS+54,j*CS+32];
function findNear(){NEAR=null;const cx=Math.floor(B.x/CS),cz=Math.floor(B.z/CS);for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const t=svcAt(cx+i,cz+j);if(!t)continue;const[x,z]=svcE(cx+i,cz+j);if(Math.hypot(B.x-x,B.z-z)<5)NEAR={t,i:cx+i,j:cz+j}}}
function findTarget(tt,ci,cj){for(let r=1;r<=9;r++){let best=null,bd=1e9;for(let i=-r;i<=r;i++)for(let j=-r;j<=r;j++){if(Math.max(Math.abs(i),Math.abs(j))!=r)continue;if(svcAt(ci+i,cj+j)!=tt)continue;const[x,z]=svcE(ci+i,cj+j),d=Math.hypot(x-B.x,z-B.z);if(d<bd){bd=d;best={x,z,d}}}if(best)return best}return null}
const opt=(a,b,f)=>el('button','btn opt','<b>'+a+'</b><br><small>'+b+'</small>',f);
function startJob(t,n){const J=JOBS[t],tg=findTarget(J.tt,n.i,n.j);if(!tg){toast('Chưa có nơi nhận gần đây, hãy đi xa hơn',2500);return}
JOB={n:J.n,r:J.r,tt:J.tt,x:tg.x,z:tg.z,left:Math.round(tg.d/3.2+45)};closeP();toast('Nhận việc: '+J.n,2800)}
function openSvc(n){const t=n.t;openP(SVN[t],b=>{b.append(el('div','row','<small>'+SVD[t]+'</small>'));
if(t=='H'){const fee=S.id?50000:150000;b.append(opt('Khám sức khoẻ tổng quát','Phí '+money(fee)+(S.id?' (có CCCD nên được giảm)':' · làm CCCD ở công an để được giảm')+' · hồi đầy sức khoẻ',()=>{if(S.mon<fee){toast('Không đủ tiền khám',2000);return}S.mon-=fee;S.hp=100;closeP();toast('Đã khám xong, sức khoẻ tốt',2500)}))}
else if(t=='P'){b.append(opt('Làm căn cước công dân',S.id?'Bạn đã có CCCD':'Miễn phí · được giảm viện phí khi đi khám',()=>{if(S.id){toast('Bạn đã có CCCD',1800);return}S.id=true;closeP();toast('Đã cấp căn cước công dân',2500)}))}
else{b.append(opt('Ăn nhẹ ở căng-tin','Phí '+money(20000)+' · hồi 25 sức khoẻ',()=>{if(S.mon<20000){toast('Không đủ tiền',2000);return}S.mon-=20000;S.hp=Math.min(100,S.hp+25);closeP();toast('Đã nạp lại năng lượng',2000)}))}
const J=JOBS[t];b.append(JOB?opt('Đang có nhiệm vụ',JOB.n+' · huỷ nhiệm vụ',()=>{JOB=null;closeP()}):opt('Nhận việc: '+J.n,'Thưởng '+money(J.r)+' · giao đúng hạn',()=>startJob(t,n)));
b.append(el('button','btn','Đóng',closeP))})}
$('svcBtn').onclick=()=>NEAR&&!panelOpen&&openSvc(NEAR);
addEventListener('keydown',e=>{if(e.code=='KeyE'&&mode=='play'&&!panelOpen&&NEAR)openSvc(NEAR)});
function updLife(dt){if(mode!='play'||panelOpen)return;S.hp=Math.max(0,S.hp-dt*.04);if(JOB){JOB.left-=dt;if(JOB.left<=0){JOB=null;toast('Quá hạn, nhiệm vụ thất bại',2500)}}
lifeT-=dt;if(lifeT>0)return;lifeT=.25;findNear();
if(JOB&&Math.hypot(B.x-JOB.x,B.z-JOB.z)<7){S.mon+=JOB.r;toast('Hoàn thành: +'+money(JOB.r),3000);JOB=null}
if(S.hp<25&&!hpWarn){hpWarn=true;toast('Sức khoẻ yếu, hãy ghé bệnh viện',2800)}if(S.hp>40)hpWarn=false;
$('hpb').style.width=S.hp+'%';$('hpb').style.background=S.hp<30?'#e5484d':'#3fb56b';$('mon').textContent=money(S.mon)+(S.id?' · CCCD':'');
const j=$('job');if(JOB){const dx=JOB.x-B.x,dz=JOB.z-B.z,d=Math.hypot(dx,dz),m=Math.floor(JOB.left/60),sc=Math.floor(JOB.left%60);j.style.display='block';j.innerHTML=JOB.n+'<br>'+fmtD(d)+' · hướng '+DIRS[Math.round(Math.atan2(dx,-dz)/(PI/4)+8)%8]+' · '+m+':'+String(sc).padStart(2,'0')}else j.style.display='none';
const bt=$('svcBtn');if(NEAR){bt.style.display='flex';bt.innerHTML='Vào '+SVN[NEAR.t]+(touch?'':' · E')}else bt.style.display='none'}
/* ===== VÒNG LẶP ===== */
let last=performance.now(),fr=0,lastKey='',locT=0;
function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;fr++;simT+=dt;uT.value=simT;if(S.real){const d=new Date();tod=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600+d.getMilliseconds()/3.6e6}else tod=(tod+dt*S.ts/90)%24;
updBike(dt);updLife(dt);updVeh(dt);updPed(dt);updSchool();updCam(dt);ensure(B.x,B.z,1);if(fr%3==0)updSky();
dome.position.copy(cam.position);stars.position.copy(cam.position);sunSp.position.copy(cam.position).addScaledVector(LD,780);moonSp.position.copy(cam.position).addScaledVector(LD,-780);
const rx=Math.round(B.x/2)*2,rz=Math.round(B.z/2)*2;sun.target.position.set(rx,0,rz);sun.position.set(rx+LD.x*150,LD.y*150,rz+LD.z*150);
$('spd').innerHTML=Math.round(Math.abs(B.v)*3.6)+' <small>km/h</small>';
if(fr%4==0)drawMap(mini,150,B.x,B.z,mapR,B.h);if(bigMap&&fr%6==0)drawMap(bigMap.getContext('2d'),bigMap.width,B.x,B.z,mapZ,null,true);
locT-=dt;if(locT<0){locT=.25;const w=where(),pos='X '+Math.round(B.x)+' · Z '+Math.round(B.z);$('loc').innerHTML=clk()+' · '+PER(tod)+'<small>'+w.st+' · '+w.kn+'<br>'+w.nl+'</small>';
if(bigMap&&$('mapinfo'))$('mapinfo').innerHTML='<b>'+w.st+'</b> · '+w.kn+'<br>Toạ độ '+pos+' (m) · Ô '+w.cx+','+w.cz+' · '+Math.round(Math.abs(B.v)*3.6)+' km/h';
if(w.key!=lastKey&&mode=='play'){lastKey=w.key;toast(w.kn,1600)}}
if(fr%600==0)save();ren.render(scene,cam)}
/* ===== KHỞI ĐỘNG ===== */
function buildSky(){const k=$('sk');k.setAttribute('viewBox','0 0 1200 300');k.setAttribute('preserveAspectRatio','xMidYMax slice');const r=rng(11);let h='<circle cx="600" cy="170" r="130" fill="#ffb26b" opacity=".35"/>';
for(const[c,mn,mx,w]of[['#3a2a6a',70,190,0],['#1a1236',40,140,1]]){let x=-10;while(x<1210){const bw=40+r()*70,bh=mn+r()*(mx-mn);h+='<rect x="'+x+'" y="'+(300-bh)+'" width="'+bw+'" height="'+bh+'" fill="'+c+'"/>';if(w)for(let y=300-bh+14;y<286;y+=18)for(let q=x+8;q<x+bw-10;q+=14)if(r()<.35)h+='<rect x="'+q+'" y="'+y+'" width="6" height="8" fill="#ffd27a" opacity=".85"/>';x+=bw+4}}
k.innerHTML=h+'<rect y="284" width="1200" height="16" fill="#0b0820"/>'}
(async()=>{buildSky();document.body.classList.add('menu');ren.setSize(innerWidth,innerHeight);setQ(touch?'low':S.q);updSky();C.d=9;loop();
for(let i=0;i<60&&chunks.size<25;i++){$('lbar').style.width=Math.min(100,chunks.size/25*100)+'%';await new Promise(r=>setTimeout(r,50))}
$('ldw').style.display='none';$('mb').style.display='block';$('loading').classList.remove('ld');
addEventListener('keydown',e=>{if(mode!='play'&&!panelOpen&&(e.code=='Enter'||e.code=='Space'))$('go').click()});
$('go').onclick=()=>{aInit();mode='play';C.d=6.5;document.body.classList.remove('menu');$('loading').classList.add('done');toast('Chào mừng đến Tiny Ride',2500)}})();
</script></body></html>
