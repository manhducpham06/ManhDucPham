function openSet(){openPanel('Settings',b=>{[['Music','mus',0,1,.05],['SFX','sfx',0,1,.05],['Camera','cam',.4,2,.1]].forEach(([l,k,a,z,st])=>{const r=document.createElement('input');r.type='range';r.min=a;r.max=z;r.step=st;r.value=S.set[k];r.oninput=()=>{S.set[k]=+r.value;vol()};b.append(el('p','',l+' '),r)});
const q=document.createElement('select');q.innerHTML='<option>low</option><option>medium</option><option>high</option>';q.value=S.set.q;q.onchange=()=>setQ(q.value);b.append(el('p','','Graphics '),q)})}
function openMenu(){openPanel('TINY RIDE',b=>{[['Tiếp tục',closeP],['Nhân vật & xe',()=>openWard(false)],['Nhật ký',openJournal],['Bản đồ',openMap],['Cách chơi',openHelp],['Settings',openSet],['Lưu game',()=>{save();closeP()}],['Tải game',()=>{if(load())closeP();else toast('Chưa có bản lưu',1500)}],['Xóa dữ liệu',()=>{if(confirm('Xóa toàn bộ dữ liệu?')){localStorage.removeItem('tinyride');location.reload()}}]].forEach(([l,f])=>{const x=el('button','btn',l,f);x.style.cssText='display:block;width:100%';b.append(x)})})}
$('bm').onclick=()=>{MUTE=!MUTE;$('bm').style.opacity=MUTE?.4:1;sfx.click()};$('bc').onclick=()=>{sfx.click();openWard(false)};$('bj').onclick=()=>{sfx.click();openJournal()};$('bp').onclick=()=>{sfx.click();openMap()};$('bg').onclick=()=>{sfx.click();openMenu()};
/* ===== BẢN ĐỒ / MINIMAP (xoay theo hướng xe, icon vẽ bằng vector) ===== */
function drawMap(x,s,mode){const full=mode=='full',rg=full?190:55,cx=full?0:P.pos.x,cz=full?0:P.pos.z,k=s/(2*rg);x.clearRect(0,0,s,s);x.save();x.translate(s/2,s/2);if(!full)x.rotate(P.rot+Math.PI);x.scale(k,k);x.translate(-cx,-cz);
x.fillStyle='#6ccfc3';x.fillRect(-400,-400,800,800);x.fillStyle='#f1dfa4';x.fillRect(-HALF,-HALF,2*HALF,2*HALF);x.fillStyle='#8fd16f';x.fillRect(-HALF+8,-HALF+8,2*HALF-16,2*HALF-16);
x.fillStyle='#b4dc8c';x.beginPath();x.arc(HX,HZ,22,0,7);x.fill();x.fillStyle='#d9dccf';x.fillRect(-120,-120,240,240);x.fillStyle='#8fd16f';[[72,24],[24,-72]].forEach(([a,b])=>x.fillRect(a-19,b-19,38,38));
x.fillStyle='#8a9aa0';for(let i=-2;i<=2;i++){x.fillRect(i*48-5,-120,10,240);x.fillRect(-120,i*48-5,240,10)}
const r=(full?9:8)/k;LM.forEach(l=>{const f=S.found.includes(l.id);x.beginPath();x.arc(l.x,l.z,r,0,7);x.fillStyle=f?'#f6c453':'#fffaf0';x.fill();x.lineWidth=2.2/k;x.strokeStyle='#2f4a46';x.stroke();x.beginPath();x.arc(l.x,l.z,r*.45,0,7);x.fillStyle=f?'#2f4a46':l.c;x.fill()});
if(full){x.font=`bold ${13/k}px sans-serif`;x.textAlign='center';x.lineWidth=3/k;x.strokeStyle='#fffaf0';x.fillStyle='#2f4a46';LM.forEach(l=>{x.strokeText(l.n,l.x,l.z-r*1.5);x.fillText(l.n,l.x,l.z-r*1.5)})}
x.restore();x.save();if(full)x.translate(s/2+(P.pos.x-cx)*k,s/2+(P.pos.z-cz)*k);else x.translate(s/2,s/2);x.rotate(full?Math.PI-P.rot:0);x.fillStyle='#fff';x.strokeStyle='#2f4a46';x.lineWidth=2.5;x.beginPath();x.moveTo(0,-9);x.lineTo(7,8);x.lineTo(0,4);x.lineTo(-7,8);x.closePath();x.fill();x.stroke();x.restore();
if(!full){const a=P.rot+Math.PI,nx=s/2+Math.sin(a)*(s/2-12),ny=s/2-Math.cos(a)*(s/2-12);x.fillStyle='#2f4a46';x.beginPath();x.arc(nx,ny,9,0,7);x.fill();x.fillStyle='#fff';x.font='bold 11px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('N',nx,ny+1)}}
const mini=$('mini').getContext('2d');
/* ===== SAVE / LOAD ===== */
function save(silent){try{S.pos=[P.pos.x,P.pos.z];S.rot=P.rot;localStorage.setItem('tinyride',JSON.stringify(S));if(!silent)toast('Đã lưu game',1200)}catch(e){console.warn(e)}}
function load(){try{const v=JSON.parse(localStorage.getItem('tinyride'));if(!v)return false;S=Object.assign(D(),v);S.set=Object.assign(D().set,v.set);S.look=Object.assign(D().look,v.look);P.pos.set(S.pos[0],H(S.pos[0],S.pos[1]),S.pos[1]);P.rot=S.rot;P.v=0;rebuild();vol();setQ(S.set.q);hud();return true}catch(e){return false}}
/* ===== INPUT: bàn phím, chuột, cảm ứng ===== */
const K={},J={x:0,y:0},C={yaw:2*Math.PI,pitch:.32,d:7.5,idle:9,f:new T.Vector3(0,2,14)};let boostBtn=0,hopReq=0;
function look(dx,dy){C.yaw-=dx*.005*S.set.cam;C.pitch=clamp(C.pitch+dy*.004*S.set.cam,.08,1.2);C.idle=0}
addEventListener('keydown',e=>{K[e.code]=1;aInit();if(e.code=='Space')e.preventDefault();if(e.repeat)return;
if(e.code=='KeyE'&&nearShop())openWard(true);if(e.code=='KeyF'&&!busy())bell();if(e.code=='Space')hopReq=1;
if(e.code=='Escape'){if(panelOpen)closeP();else if(mode=='play')openMenu()}if(!busy()){if(e.code=='KeyM')openMap();if(e.code=='KeyJ')openJournal()}});
addEventListener('keyup',e=>K[e.code]=0);addEventListener('blur',()=>{for(const k in K)K[k]=0});addEventListener('pointerdown',aInit);
let dp=null,lx=0,ly=0;ren.domElement.addEventListener('pointerdown',e=>{dp=e.pointerId;lx=e.clientX;ly=e.clientY});
addEventListener('pointermove',e=>{if(e.pointerId==dp&&!busy()){look(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY}});
const pe=e=>{if(e.pointerId==dp)dp=null};addEventListener('pointerup',pe);addEventListener('pointercancel',pe);
ren.domElement.addEventListener('wheel',e=>{C.d=clamp(C.d+Math.sign(e.deltaY)*.8,4,16)},{passive:true});
const jb=$('joy'),kn=$('knob');let jid=null;
function jmv(e){const r=jb.getBoundingClientRect();let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;const m=r.width/2-14,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}kn.style.transform=`translate(${dx}px,${dy}px)`;J.x=dx/m;J.y=-dy/m}
jb.addEventListener('pointerdown',e=>{jid=e.pointerId;jb.setPointerCapture(jid);jmv(e)});jb.addEventListener('pointermove',e=>{if(e.pointerId==jid)jmv(e)});
const je=e=>{if(e.pointerId==jid){jid=null;J.x=J.y=0;kn.style.transform='none'}};jb.addEventListener('pointerup',je);jb.addEventListener('pointercancel',je);
$('bb').addEventListener('pointerdown',()=>boostBtn=1);['pointerup','pointercancel','pointerleave'].forEach(n=>$('bb').addEventListener(n,()=>boostBtn=0));
$('bh').addEventListener('pointerdown',()=>hopReq=1);$('bl').addEventListener('pointerdown',()=>{if(!busy())bell()});
function bell(){sfx.bell();fx(emoT('🔔'),P.pos.clone().add(UP),1,.7)}
const nearShop=()=>!busy()&&Math.hypot(P.pos.x-24,P.pos.z-33)<10;$('prompt').onclick=()=>{if(nearShop())openWard(true)};
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
/* ===== VẬT LÝ XE ===== */
function upd(dt){const can=!busy();let st=0,th=0;if(can){st=clamp((K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+J.x,-1,1);th=clamp((K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0)+J.y,-1,1)}
const bo=can&&(K.ShiftLeft||K.ShiftRight||boostBtn)||P.boost>0,mx=bo?17:11,ac=bo?13:8;P.boost-=dt;
if(th>0)P.v+=th*ac*dt;else if(th<0)P.v+=th*(P.v>.5?18:6)*dt;else P.v*=Math.exp(-1.3*dt);if(P.v>mx)P.v-=8*dt;P.v=Math.max(P.v,-3.5);
P.steer+=(st-P.steer)*(1-Math.exp(-8*dt));P.rot-=P.steer*dt*(2.2-Math.min(1.2,Math.abs(P.v)/10))*clamp(P.v/3,-1,1);
const nx=P.pos.x+Math.sin(P.rot)*P.v*dt,nz=P.pos.z+Math.cos(P.rot)*P.v*dt;if(H(nx,nz)<.2)P.v*=-.2;else{P.pos.x=nx;P.pos.z=nz}
P.hit-=dt;for(const o of obs)if(o.on){const dx=P.pos.x-o.x,dz=P.pos.z-o.z,d=Math.hypot(dx,dz),m=o.r+.6;if(d<m&&d>0){P.pos.x=o.x+dx/d*m;P.pos.z=o.z+dz/d*m;if(Math.abs(P.v)>3&&P.hit<0){P.v*=.4;P.hit=.4;sfx.no();fx(dustT,P.pos.clone().add(UP),4,.7,1)}else if(Math.abs(P.v)>3)P.v*=.9}}
const gy=H(P.pos.x,P.pos.z);if(hopReq&&can&&P.pos.y<=gy+.05){P.vy=6.5;sfx.jump()}hopReq=0;P.vy-=22*dt;P.pos.y+=P.vy*dt;if(P.pos.y<=gy){P.pos.y=gy;P.vy=0}
if(bo&&P.v>8&&fr%6==0)fx(dustT,P.pos.clone().add(new T.Vector3(0,.3,0)),1,.5,.4);
P.grp.position.copy(P.pos);P.grp.rotation.y=P.rot;pose(dt)}
function collect(){for(let i=0;i<CN.length;i++)if(!S.taken.includes(i)&&Math.hypot(CN[i][0]-P.pos.x,CN[i][1]-P.pos.z)<1.6&&P.pos.y<2.2){S.taken.push(i);sfx.coin();gain(2,5)}
STARS.forEach((m,i)=>{if(!S.stars.includes(i)&&Math.hypot(m.position.x-P.pos.x,m.position.z-P.pos.z)<2.2){S.stars.push(i);m.visible=false;sfx.ok();fx(emoT('✨'),m.position,8);toast(`Sao ${S.stars.length}/${STARS.length}`,1400);gain(15,10);if(S.stars.length==STARS.length)setTimeout(()=>{toast('Đã nhặt đủ sao!<br><small>+200 xu</small>',3000);gain(100,200)},1500);save(true)}});
PADS.forEach(p=>{if(P.boost<=0&&Math.hypot(p.position.x-P.pos.x,p.position.z-P.pos.z)<2.4){P.boost=2.5;P.v=Math.max(P.v,12);sfx.act();fx(emoT('💨'),P.pos.clone().add(UP),3)}});
LM.forEach(l=>{if(!S.found.includes(l.id)&&Math.hypot(l.x-P.pos.x,l.z-P.pos.z)<l.r){S.found.push(l.id);sfx.ok();toast(`Khám phá: ${l.n}<br><small>+40 XP · +20 xu</small>`,2600);fx(emoT('✨'),P.pos.clone().add(UP),10);gain(40,20);save(true)}})}
/* ===== VÒNG LẶP ===== */
let last=performance.now(),tm=0,it=0,fr=0,ts=0,saveT=0;const M4=new T.Matrix4(),Q4=new T.Quaternion(),V3=new T.Vector3(),SC=new T.Vector3(1,1,1),YA=new T.Vector3(0,1,0);
function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;tm+=dt;fr++;
const p=wg.attributes.position;for(let i=0;i<p.count;i++)p.array[i*3+1]=Math.sin(wbase[i*3]*.04+tm*1.2)*.12+Math.cos(wbase[i*3+2]*.045+tm*.9)*.1;p.needsUpdate=true;
for(const c of cars){const u=c.userData;u.t+=u.dir*u.sp*dt;if(u.t>124)u.t=-124;if(u.t<-124)u.t=124;const o=u.dir>0?2.3:-2.3;
if(u.ax){c.position.set(u.t,.62,u.line+o);c.rotation.y=u.dir>0?Math.PI/2:-Math.PI/2}else{c.position.set(u.line+o,.62,u.t);c.rotation.y=u.dir>0?0:Math.PI}}
for(const t of trees)t.rotation.z=Math.sin(tm*1.3+t.userData.ph)*.04;
for(const c of clouds){c.position.x+=dt*1.5;if(c.position.x>260)c.position.x=-260}
for(const b of birds){const u=b.userData;u.a+=dt*.25;b.position.set(Math.cos(u.a)*u.r,u.h+Math.sin(tm+u.r),Math.sin(u.a)*u.r);b.rotation.y=-u.a;u.wl.rotation.z=Math.sin(tm*10)*.6;u.wr.rotation.z=-Math.sin(tm*10)*.6}
glow.scale.setScalar(1+Math.sin(tm*3)*.15);STAR.rotation.y=tm*2;STARS.forEach((m,i)=>{m.rotation.y=tm*2+i;m.position.y=H(m.position.x,m.position.z)+1.4+Math.sin(tm*2+i)*.2});
for(let i=0;i<CN.length;i++){const gone=S.taken.includes(i);Q4.setFromAxisAngle(YA,tm*2.5+i);M4.compose(V3.set(CN[i][0],1.1,CN[i][1]),Q4,gone?V3.set(0,0,0).clone():SC);coinM.setMatrixAt(i,M4)}coinM.instanceMatrix.needsUpdate=true;
for(let i=FXS.length-1;i>=0;i--){const f=FXS[i];f.s.position.addScaledVector(f.v,dt);f.l-=dt;f.s.material.opacity=Math.min(1,f.l*2);if(f.l<=0){scene.remove(f.s);f.s.material.dispose();FXS.splice(i,1)}}
if(mode=='intro'){it+=dt;const a=it*.22+.5;cam.position.set(Math.sin(a)*190,110,Math.cos(a)*190);cam.lookAt(0,0,0);
if(it>1&&!ts){ts=1;toast('Welcome to Tiny Ride.',2400)}if(it>4&&ts==1){ts=2;toast('Every street hides a little surprise.',2600)}
if(it>7){mode='play';C.f.set(P.pos.x,P.pos.y+1.5,P.pos.z);C.idle=9;cam.position.set(P.pos.x,P.pos.y+5,P.pos.z+9)}}
else{upd(dt);collect();C.idle+=dt;if(C.idle>1.5&&Math.abs(P.v)>1){let d=P.rot+Math.PI-C.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));C.yaw+=d*(1-Math.exp(-2.2*dt))}
C.f.lerp(V3.set(P.pos.x,P.pos.y+1.5,P.pos.z),1-Math.exp(-10*dt));const cp=Math.cos(C.pitch),w=new T.Vector3(C.f.x+Math.sin(C.yaw)*cp*C.d,C.f.y+Math.sin(C.pitch)*C.d,C.f.z+Math.cos(C.yaw)*cp*C.d);
w.y=Math.max(w.y,H(w.x,w.z)+.8);cam.position.lerp(w,1-Math.exp(-8*dt));cam.lookAt(C.f);cam.fov=55+Math.min(Math.max(P.v,0),17)*.7;cam.updateProjectionMatrix()}
sun.position.set(Math.round(P.pos.x/2)*2+30,50,Math.round(P.pos.z/2)*2+20);sun.target.position.set(Math.round(P.pos.x/2)*2,0,Math.round(P.pos.z/2)*2);
const pr=$('prompt'),ns=nearShop();pr.style.display=ns?'block':'none';if(ns)pr.textContent=touch?'Vào cửa hàng':'[E] Vào cửa hàng';
if(fr%4==0){drawMap(mini,140,'mini');$('spd').innerHTML='<b>'+Math.round(Math.abs(P.v)*3)+'</b> km/h'}
saveT+=dt;if(saveT>30){saveT=0;save(true)}
ren.render(scene,cam)}
/* ===== KHỞI ĐỘNG ===== */
ren.setSize(innerWidth,innerHeight);setQ('medium');rebuild();load();hud();
setTimeout(()=>$('fade').style.opacity=0,200);loop();
</script></body></html>
